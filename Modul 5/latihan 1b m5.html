<!DOCTYPE html>
<html>
<head>
    <title>Menggunakan Media Query</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .smartphone {
            display: none;
        }

        .logo-uns {
            display: none;
        }

        @media only screen and (max-width: 428px) {
            body {
                background-color: yellow;
            }

            .smartphone {
                display: block;
            }
        }

        @media only screen and (min-width: 1025px) {
            .logo-uns {
                display: block;
            }

            .logo-uns img {
                width: 200px;
            }
        }
    </style>
</head>

<body>
    <h3>Menggunakan Media Query CSS 3</h3>

    <div class="smartphone">
        <h2>Terdeteksi ukuran smartphone</h2>
    </div>

    <div class="logo-uns">
        <img src="Logo-UNS-Biru.png" alt="Logo UNS">
    </div>
</body>
</html>
